                    name: Team Workspace
                    description: Shared team files
                    type: d
                    parent_id: xyz98765cba43210fe
                    deleted: false
                    created: 2024-01-10T09:00:00+0000
                    modified: 2024-06-20T11:30:00+0000
                    syncable: false
                    secure: false
                    isFavorite: true
                    isShared: true
                    totalFilesCount: 25
                    totalFoldersCount: 5
                    totalMembersCount: 8
                    avStatus: clean
                    dlpStatus: clean
        '490':
