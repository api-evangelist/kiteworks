      - files
      parameters:
      - in: query
        name: orderBy
        required: false
        description: 'Field to sort by. Default is `shared`.<br>Allowed values: `name`, `size`, `shared`, `sharedBy`, `modified`.'
        schema:
          type: string
          enum:
          - name
          - size
          - shared
          - sharedBy
          - modified
      - in: query
        name: orderType
        required: false
        description: Sort direction. `asc` for ascending, `desc` for descending. Default is `desc`.
        schema:
          type: string
          enum:
          - asc
          - desc
      - in: query
        name: limit
        required: false
        description: Range limit.
        schema:
          type: integer
          minimum: 1
      - in: query
        name: offset
        required: false
        description: Range offset.
        schema:
          type: integer
          minimum: 0
      - in: query
        name: with
        required: false
        description: Specifies additional fields to include in the response.
        schema:
          type: string
      - in: query
        name: mode
        required: false
        description: Determines the detail level of the response body.
