          - urn:ietf:params:scim:schemas:core:2.0:User:roles.value
          - urn:ietf:params:scim:schemas:core:2.0:User:active
      - in: query
        name: sortOrder
        required: false
        description: Sort direction for the results.<br>`ascending` – Sort in ascending order.<br>`descending` – Sort in descending order.
        schema:
          type: string
          enum:
          - ascending
          - descending
      - in: query
        name: startIndex
        required: false
        description: 1-based index of the first result to return, used for pagination.
        schema:
          type: integer
      - in: query
        name: count
        required: false
        description: 'Maximum number of results to return per page (maximum: 1,000,000).'
        schema:
          type: integer
          maximum: 1000000
