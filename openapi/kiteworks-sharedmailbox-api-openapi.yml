        schema:
          type: array
          items:
            type: string
      responses:
        '204':
          description: The shared mailboxes have been deleted successfully.
        '401':
          description: 'Unauthorized<br /><br /><i>Possible error codes: </i>ERR_AUTH_INVALID_CSRF, ERR_AUTH_UNAUTHORIZED, ERR_ENTITY_NOT_FOUND'
