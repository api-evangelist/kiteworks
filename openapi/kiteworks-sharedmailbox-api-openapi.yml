      parameters:
      - in: path
        name: id
        required: true
        description: The unique identifier (UUID) of the user.
        schema:
          type: string
          format: uuid
      - in: query
        name: returnEntity
        required: false
        description: If true, includes the entity in the response body.
        schema:
          type: boolean
      - in: query
        name: with
        required: false
        description: Specifies additional fields to include in the response.
        schema:
          type: string
      - in: query
        name: mode
        required: false
        description: Determines the detail level of the response body.
        schema:
          type: string
          enum:
          - compact
          - full_no_links
          - full_with_links
          - full
      responses:
        '200':
          description: The web forms are returned successfully.
          content:
            application/json:
              schema:
