aid: kiteworks
name: Kiteworks
description: Kiteworks operates a Private Data Network (PDN) that unifies secure email, secure file
  sharing, secure web forms, managed file transfer (MFT), and SFTP behind a single hardened virtual
  appliance with a common governance, encryption, and audit layer. The platform targets regulated
  industries — government, defense, healthcare, financial services, legal, manufacturing, and higher
  education — where sensitive content leaving the organization must be tracked and provably compliant
  with regimes such as CMMC 2.0, FedRAMP, HIPAA, GDPR, and NIST 800-171. Kiteworks exposes its platform
  through a versioned REST API (currently v28) covering files, folders, mail, web forms, users, admin,
  SCIM provisioning, and search across roughly 400 endpoints, plus a PubSub webhook service for
  real-time event delivery and an Apache-2.0 licensed Model Context Protocol (MCP) server that lets AI
  assistants operate on Kiteworks content under OAuth 2.1. The company was formerly known as Accellion.
